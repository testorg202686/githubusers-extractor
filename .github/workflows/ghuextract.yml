```yaml
name: Exportar miembros de GitHub

on:
  workflow_dispatch:

  schedule:
    # Ejecutar diariamente a las 7:00 AM hora de México
    - cron: "0 13 * * *"

permissions:
  contents: read

env:
  ORGANIZATION: testorg202686

jobs:
  export-members:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Configurar Python
      # ----------------------------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests openpyxl

      # ----------------------------------------------------------
      # Obtener información de GitHub y generar reportes
      # ----------------------------------------------------------
      - name: Generar reporte
        env:
          GH_TOKEN: ${{ secrets.ORG_REPORT_TOKEN }}
        run: |
          python <<'PY'

          import csv
          import os
          import requests
          from openpyxl import Workbook


          # ==========================================================
          # Configuración
          # ==========================================================

          ORG = os.environ["ORGANIZATION"]
          TOKEN = os.environ["GH_TOKEN"]

          API = "https://api.github.com"

          HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          # ==========================================================
          # Funciones
          # ==========================================================

          def get(url, params=None):
              """Realiza una consulta a la API de GitHub."""
              response = requests.get(
                  url,
                  headers=HEADERS,
                  params=params
              )
              response.raise_for_status()
              return response.json()


          def get_all(url, params=None):
              """Obtiene todos los resultados manejando paginación."""
              params = params or {}
              params["per_page"] = 100

              results = []
              page = 1

              while True:
                  params["page"] = page
                  data = get(url, params)

                  if not data:
                      break

                  results.extend(data)
                  page += 1

              return results


          # ==========================================================
          # Obtener miembros
          # ==========================================================

          print(f"Obteniendo miembros de: {ORG}")

          members = get_all(
              f"{API}/orgs/{ORG}/members"
          )

          print(f"Miembros encontrados: {len(members)}")


          # ==========================================================
          # Obtener información de 2FA
          # ==========================================================

          tfa_disabled = {
              user["login"]
              for user in get_all(
                  f"{API}/orgs/{ORG}/members",
                  {"filter": "2fa_disabled"}
              )
          }

          tfa_insecure = {
              user["login"]
              for user in get_all(
                  f"{API}/orgs/{ORG}/members",
                  {"filter": "2fa_insecure"}
              )
          }


          # ==========================================================
          # Obtener miembros públicos
          # ==========================================================

          public_members = {
              user["login"]
              for user in get_all(
                  f"{API}/orgs/{ORG}/public_members"
              )
          }


          # ==========================================================
          # Obtener identidades SAML
          # ==========================================================

          query = """
          query($org: String!, $cursor: String) {
            organization(login: $org) {
              samlIdentityProvider {
                externalIdentities(
                  first: 100
                  after: $cursor
                  membersOnly: true
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    samlIdentity {
                      nameId
                    }
                    user {
                      login
                    }
                  }
                }
              }
            }
          }
          """

          saml_users = {}
          cursor = None

          while True:

              response = requests.post(
                  f"{API}/graphql",
                  headers=HEADERS,
                  json={
                      "query": query,
                      "variables": {
                          "org": ORG,
                          "cursor": cursor
                      }
                  }
              )

              response.raise_for_status()

              data = response.json()

              if "errors" in data:
                  print("No se pudo obtener información SAML.")
                  break

              identities = (
                  data["data"]["organization"]
                  .get("samlIdentityProvider")
              )

              if not identities:
                  break

              for identity in identities["nodes"]:

                  user = identity.get("user")
                  saml = identity.get("samlIdentity")

                  if user and saml:
                      saml_users[user["login"]] = (
                          saml.get("nameId", "")
                      )

              if not identities["pageInfo"]["hasNextPage"]:
                  break

              cursor = identities["pageInfo"]["endCursor"]


          print(f"Identidades SAML: {len(saml_users)}")


          # ==========================================================
          # Columnas del reporte
          # ==========================================================

          columns = [
              "login",
              "name",
              "tfa_enabled",
              "tfa_level",
              "tfa_required_by",
              "is_public",
              "role",
              "saml_name_id",
              "organization_roles_count"
          ]


          # ==========================================================
          # Construir reporte
          # ==========================================================

          rows = []

          for member in members:

              login = member["login"]

              print(f"Procesando: {login}")

              user = get(
                  f"{API}/users/{login}"
              )

              membership = get(
                  f"{API}/orgs/{ORG}/memberships/{login}"
              )


              # Estado de 2FA
              if login in tfa_disabled:
                  tfa_enabled = "false"
                  tfa_level = "disabled"

              elif login in tfa_insecure:
                  tfa_enabled = "true"
                  tfa_level = "insecure"

              else:
                  tfa_enabled = "true"
                  tfa_level = "secure"


              # Rol dentro de la organización
              role = (
                  "Owner"
                  if membership.get("role") == "admin"
                  else "Member"
              )


              rows.append([
                  login,
                  user.get("name") or "",
                  tfa_enabled,
                  tfa_level,
                  "",
                  "true" if login in public_members else "false",
                  role,
                  saml_users.get(login, ""),
                  ""
              ])


          # ==========================================================
          # Generar CSV
          # ==========================================================

          csv_file = "github-members-report.csv"

          with open(
              csv_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as file:

              writer = csv.writer(file)
              writer.writerow(columns)
              writer.writerows(rows)


          # ==========================================================
          # Generar Excel
          # ==========================================================

          xlsx_file = "github-members-report.xlsx"

          workbook = Workbook()
          sheet = workbook.active
          sheet.title = "Members"

          sheet.append(columns)

          for row in rows:
              sheet.append(row)

          # Congelar encabezados y habilitar filtros
          sheet.freeze_panes = "A2"
          sheet.auto_filter.ref = sheet.dimensions

          # Ajustar automáticamente el ancho de las columnas
          for column in sheet.columns:

              width = max(
                  len(str(cell.value or ""))
                  for cell in column
              )

              sheet.column_dimensions[
                  column[0].column_letter
              ].width = min(width + 2, 40)

          workbook.save(xlsx_file)


          # ==========================================================
          # Resumen
          # ==========================================================

          print("")
          print("==========================================")
          print("REPORTE GENERADO CORRECTAMENTE")
          print("==========================================")
          print(f"Organización : {ORG}")
          print(f"Usuarios     : {len(rows)}")
          print(f"CSV          : {csv_file}")
          print(f"Excel        : {xlsx_file}")
          print("==========================================")


          PY


      # ----------------------------------------------------------
      # Guardar reportes como artifacts
      # ----------------------------------------------------------
      - name: Guardar reportes
        uses: actions/upload-artifact@v4
        with:
          name: github-members-report
          path: |
            github-members-report.csv
            github-members-report.xlsx


      # ----------------------------------------------------------
      # Enviar reporte por correo
      #
      # Deshabilitado temporalmente.
      # ----------------------------------------------------------
      #
      # - name: Enviar reporte por correo
      #   uses: dawidd6/action-send-mail@v6
      #   with:
      #     server_address: ${{ secrets.SMTP_SERVER }}
      #     server_port: ${{ secrets.SMTP_PORT }}
      #     username: ${{ secrets.SMTP_USERNAME }}
      #     password: ${{ secrets.SMTP_PASSWORD }}
      #
      #     from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
      #
      #     to: |
      #       usuario1@empresa.com,
      #       usuario2@empresa.com
      #
      #     subject: Reporte de miembros GitHub - ${{ env.ORGANIZATION }}
      #
      #     body: |
      #       Hola,
      #
      #       Se generó el reporte diario de miembros
      #       de GitHub.
      #
      #       Organización:
      #       ${{ env.ORGANIZATION }}
      #
      #       El archivo Excel se encuentra adjunto.
      #
      #       Saludos,
      #       GitHub Actions
      #
      #     attachments: github-members-report.xlsx
```
