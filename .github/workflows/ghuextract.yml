name: Exportar miembros de GitHub

on:
  workflow_dispatch:

  schedule:
    # Cada lunes a las 7:00 AM hora de México
    - cron: "0 13 * * 1"

permissions:
  contents: read

env:
  ORGANIZATION: test-org

jobs:
  export-members:
    runs-on: ubuntu-latest

    steps:

      # Instalar Python y las librerías necesarias
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests openpyxl

      # Obtener la información de GitHub y generar el Excel
      - name: Generar reporte
        env:
          GH_TOKEN: ${{ secrets.ORG_REPORT_TOKEN }}
          ORGANIZATION: ${{ env.ORGANIZATION }}
        run: |

          python <<'PY'

          import csv
          import os
          import requests
          from openpyxl import Workbook

          ORG = os.environ["ORGANIZATION"]
          TOKEN = os.environ["GH_TOKEN"]

          REST = "https://api.github.com"

          headers = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }


          # ------------------------------------------------------
          # Consulta REST a GitHub
          # ------------------------------------------------------
          def rest(url, params=None):

              response = requests.get(
                  url,
                  headers=headers,
                  params=params
              )

              response.raise_for_status()

              return response.json()


          # ------------------------------------------------------
          # Obtener todos los resultados de una API paginada
          # ------------------------------------------------------
          def all_pages(url, params=None):

              params = params or {}
              params["per_page"] = 100

              result = []
              page = 1

              while True:

                  params["page"] = page

                  data = rest(url, params)

                  if not data:
                      break

                  result.extend(data)
                  page += 1

              return result


          # ------------------------------------------------------
          # Obtener miembros
          # ------------------------------------------------------
          print(f"Obteniendo miembros de {ORG}...")

          members = all_pages(
              f"{REST}/orgs/{ORG}/members"
          )

          print(f"Miembros encontrados: {len(members)}")


          # ------------------------------------------------------
          # Obtener miembros con 2FA deshabilitado
          # ------------------------------------------------------
          tfa_disabled = {
              user["login"]
              for user in all_pages(
                  f"{REST}/orgs/{ORG}/members",
                  {"filter": "2fa_disabled"}
              )
          }


          # ------------------------------------------------------
          # Obtener miembros con 2FA inseguro
          # ------------------------------------------------------
          tfa_insecure = {
              user["login"]
              for user in all_pages(
                  f"{REST}/orgs/{ORG}/members",
                  {"filter": "2fa_insecure"}
              )
          }


          # ------------------------------------------------------
          # Obtener miembros públicos
          # ------------------------------------------------------
          public_members = {
              user["login"]
              for user in all_pages(
                  f"{REST}/orgs/{ORG}/public_members"
              )
          }


          # ------------------------------------------------------
          # Columnas del reporte de GitHub
          # ------------------------------------------------------
          columns = [
              "login",
              "name",
              "tfa_enabled",
              "tfa_level",
              "tfa_required_by",
              "is_public",
              "role",
              "saml_name_id",
              "organization_roles_count"
          ]


          rows = []


          # ------------------------------------------------------
          # Procesar usuarios
          # ------------------------------------------------------
          for member in members:

              login = member["login"]

              print(f"Procesando {login}...")


              # Información del usuario
              user = rest(
                  f"{REST}/users/{login}"
              )


              # Información de la membresía
              membership = rest(
                  f"{REST}/orgs/{ORG}/memberships/{login}"
              )


              # --------------------------------------------------
              # Determinar estado de 2FA
              # --------------------------------------------------
              if login in tfa_disabled:

                  tfa_enabled = "false"
                  tfa_level = "disabled"

              elif login in tfa_insecure:

                  tfa_enabled = "true"
                  tfa_level = "insecure"

              else:

                  tfa_enabled = "true"
                  tfa_level = "secure"


              # --------------------------------------------------
              # Crear registro
              # --------------------------------------------------
              rows.append([
                  login,
                  user.get("name") or "",
                  tfa_enabled,
                  tfa_level,
                  "",
                  "true" if login in public_members else "false",
                  "Owner" if membership.get("role") == "admin" else "Member",
                  "",
                  0
              ])


          # ======================================================
          # Crear CSV
          # ======================================================

          csv_file = "github-members-report.csv"

          with open(
              csv_file,
              "w",
              newline="",
              encoding="utf-8"
          ) as file:

              writer = csv.writer(file)

              writer.writerow(columns)
              writer.writerows(rows)


          # ======================================================
          # Crear Excel
          # ======================================================

          xlsx_file = "github-members-report.xlsx"

          workbook = Workbook()

          sheet = workbook.active
          sheet.title = "Members"

          sheet.append(columns)

          for row in rows:
              sheet.append(row)

          # Mantener encabezados visibles
          sheet.freeze_panes = "A2"

          # Agregar filtros
          sheet.auto_filter.ref = sheet.dimensions

          # Ajustar ancho de columnas
          for column in sheet.columns:

              width = max(
                  len(str(cell.value or ""))
                  for cell in column
              )

              sheet.column_dimensions[
                  column[0].column_letter
              ].width = min(width + 2, 40)

          workbook.save(xlsx_file)


          print()
          print("========================================")
          print("REPORTE GENERADO")
          print("========================================")
          print(f"Organización : {ORG}")
          print(f"Usuarios     : {len(rows)}")
          print(f"Excel        : {xlsx_file}")
          print(f"CSV          : {csv_file}")
          print("========================================")

          PY


      # Guardar los archivos como artifacts
      - name: Guardar reportes
        uses: actions/upload-artifact@v4
        with:
          name: github-members-report
          path: |
            github-members-report.xlsx
            github-members-report.csv
